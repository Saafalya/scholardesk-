ext><path d="M1122,492.0 L1150,492.0" fill="none" stroke="#55627A" stroke-width="1.8"  marker-end="url(#a55627A)"/><rect x="1374" y="444" width="182" height="96" rx="10" fill="white" stroke="#1B2A41" stroke-width="1.6"/><text x="1465.0" y="484.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A41">Reporter</text><text x="1465.0" y="508.0" text-anchor="middle" font-size="15" fill="#55627A">reviewer note</text><path d="M1340,492.0 L1368,492.0" fill="none" stroke="#55627A" stroke-width="1.8"  marker-end="url(#a55627A)"/><path d="M790,240 L790,290 L157.0,290 L157.0,438" fill="none" stroke="#55627A" stroke-width="1.8"  marker-end="url(#a55627A)"/><path d="M1465.0,442 L1465.0,292 L1355,292 L1355,260" fill="none" stroke="#55627A" stroke-width="1.8"  marker-end="url(#a55627A)"/><path d="M593.0,444 C593.0,386 375.0,386 375.0,438" fill="none" stroke="#A5640C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aA5640C)"/><text x="484.0" y="394" text-anchor="middle" font-size="14" fill="#A5640C">mismatch → send back (max N)</text><path d="M150,654 a190.0,14 0 0,1 380,0 v122 a190.0,14 0 0,1 -380,0 z" fill="#E3E8EF" stroke="#1B2A41" stroke-width="1.6"/><path d="M150,654 a190.0,14 0 0,0 380,0" fill="none" stroke="#1B2A41" stroke-width="1.6"/><text x="340.0" y="719.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2A41">Ollama · llama3.2:3b</text><text x="340.0" y="743.0" text-anchor="middle" font-size="14.5" fill="#55627A">local model, free</text><text x="340.0" y="762.0" text-anchor="middle" font-size="14.5" fill="#55627A">falls back to built-in rule model</text><path d="M157.0,540 L157.0,640" fill="none" stroke="#55627A" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M375.0,540 L375.0,640" fill="none" stroke="#55627A" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M1465.0,540 L1465.0,605 L470,605 L470,646" fill="none" stroke="#55627A" stroke-width="1.6" stroke-dasharray="3 5"/><text x="340" y="826" text-anchor="middle" font-size="